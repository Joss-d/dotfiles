[tools]
atuin = "latest"
bat = "latest"
broot = "latest"
btop = "latest"
chezmoi = "latest"
copier = "latest"
delta = "latest"
dive = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
lazydocker = "latest"
lazygit = "latest"
neovim = "latest"
npm = "latest"
python = "latest"
ripgrep = "latest"
rust = "latest"
sd = "latest"
starship = "latest"
tree-sitter = "latest"
uv = "latest"
zellij = "latest"
zoxide = "latest"

[tasks.chezmoi]
description = "Init chezmoi"
run = [
  "mise exec chezmoi@latest -- chezmoi init https://github.com/Joss-d/dotfiles.git",
  "mise exec chezmoi@latest -- chezmoi apply -v",
]

[tasks.fish]
description = "Switch to fish"
run = ["sudo apt install fish", "chsh -s $(command -v fish)"]

[tasks.zsh]
description = "Switch to zsh"
run = ["sudo apt install zsh", "chsh -s $(command -v zsh)"]
